<div id="academic" class="tab-content">
    <h2>Academic</h2>
    <div class="table-container">
        <table>
            <tr>
                {% for column in table.header %}
                    <th>{{column}}</th>
                {% endfor %}
            </tr>
            {% for row in table.data %}
            <tr>
                {% for value in row %}
                    <th>{{value}}</th>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </div>
    <h3>Academic Documents</h3>
    {% for document in documents %}
        <p>{{document.title}} | {{document.status}}</p>
    {% endfor %}
    <div class="buttons">
        <button onclick="approve()">Approve</button>
        <button onclick="decline()">Decline</button>
    </div>
</div>

<script>
    function approve() {
        alert('Approved');
    }

    function decline() {
        alert('Declined');
    }
</script>
